# The survey fight picked by calibration (roach_hellbat_calibration.yaml, the attack rule, 20
# fights per built-in AI build): attack-move wins 41% with 8 roaches against 8 hellbats (6: 100%,
# 9: none). Every rule, per build:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_hellbat.yaml --baseline attack --episodes 100 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_group_task:RoachGroupTask

enemy:
  mode: builtin
  race: Terran
  difficulty: VeryHard

scenarios:
  - name: roach_hellbat_8v8hb
    learner: {Roach: 8}
    enemy: {HellionTank: 8}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
