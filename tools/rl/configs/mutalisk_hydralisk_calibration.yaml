# Zerg survey calibration: mutalisks against the built-in AI's (Zerg) hydralisks. The attack rule,
# to find sizes where attack-move wins 15 to 70% (then mutalisk_hydralisk.yaml). Round 1: 10
# mutalisks won every fight against 4, 6 or 8 hydralisks. Run per build:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/mutalisk_hydralisk_calibration.yaml --baseline attack --episodes 20 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.mutalisk_group_task:MutaliskGroupTask

enemy:
  mode: builtin
  race: Zerg
  difficulty: VeryHard

scenarios:
  - name: mutalisk_hydralisk_10v10h
    learner: {Mutalisk: 10}
    enemy: {Hydralisk: 10}
    distance: [10, 12]
    time_limit: 60

  - name: mutalisk_hydralisk_10v12h
    learner: {Mutalisk: 10}
    enemy: {Hydralisk: 12}
    distance: [10, 12]
    time_limit: 60

  - name: mutalisk_hydralisk_10v14h
    learner: {Mutalisk: 10}
    enemy: {Hydralisk: 14}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
