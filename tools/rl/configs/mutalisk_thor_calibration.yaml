# Calibration for the magic box check: 8 mutalisks against 2 to 5 thors of the built-in AI, the
# attack rule, to find sizes where attack-move wins 15 to 70% (then mutalisk_thor.yaml). Run per
# build, as the built-in AI's build is otherwise drawn once per game:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/mutalisk_thor_calibration.yaml --baseline attack --episodes 20 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the tasks' movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.mutalisk_group_task:MutaliskGroupTask

enemy:
  mode: builtin
  race: Terran
  difficulty: VeryHard

scenarios:
  - name: mutas_8v2_thors
    learner: {Mutalisk: 8}
    enemy: {Thor: 2}
    distance: [10, 12]
    time_limit: 60

  - name: mutas_8v3_thors
    learner: {Mutalisk: 8}
    enemy: {Thor: 3}
    distance: [10, 12]
    time_limit: 60

  - name: mutas_8v4_thors
    learner: {Mutalisk: 8}
    enemy: {Thor: 4}
    distance: [10, 12]
    time_limit: 60

  - name: mutas_8v5_thors
    learner: {Mutalisk: 8}
    enemy: {Thor: 5}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
