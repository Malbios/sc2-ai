# cooldown_kite_1v1.yaml with learning rate 0.0003 instead of 0.01. At 0.01 the model stopped
# exploring within ~20k decisions and locked onto attacking non-stop against the scripted roach.
#
#   python -m tools.rl.train --config tools/rl/configs/cooldown_kite_1v1_gentle.yaml --timesteps 300000 --out models/cooldown-gentle-1v1

map: MicroTraining410        # his map, ported to SC2 4.10 (see docs/linux-setup.md)
decision_interval: 3         # his stepCount

learner:
  race: Terran
  task: tools.rl.examples.cooldown_kite_task:CooldownKiteTask

enemy:
  mode: scripted             # always attacks the closest unit, never gives up
  race: Terran

scenarios:
  - name: stalker_vs_1_roach
    learner: {Stalker: 1}
    enemy: {Roach: 1}
    distance: [10, 10]       # he spawns both 5 away from the map center
    time_limit: 160          # his 1200-step cap at 3 frames per step

ppo:
  learning_rate: 0.0003
  n_steps: 256               # x 4 games ~ his memorySize 1000
  batch_size: 32
  n_epochs: 16
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [128, 128]
