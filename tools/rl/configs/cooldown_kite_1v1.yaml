# Based on github.com/sharknice/SharkyRLMatrixTraining: 1 stalker kites 1 roach, with his task
# (2 actions, 3 inputs, reward for firing often), his map, decision rate and PPO settings.
#
#   python -m tools.rl.train --config tools/rl/configs/cooldown_kite_1v1.yaml --timesteps 100000 --out models/cooldown-scripted-1v1

map: MicroTraining           # his map, from his repo's Maps folder (see docs/linux-setup.md)
decision_interval: 3         # his stepCount

learner:
  race: Terran
  task: tools.rl.examples.cooldown_kite_task:CooldownKiteTask

enemy:
  # Not the built-in AI, as in his setup: it pulls its spawned units back when a fight looks bad,
  # so the stalker learned to chase fleeing roaches instead of kiting. Scripted roaches always
  # attack the closest unit, so they chase.
  mode: scripted
  race: Terran

scenarios:
  - name: stalker_vs_1_roach
    learner: {Stalker: 1}
    enemy: {Roach: 1}
    distance: [10, 10]       # he spawns both 5 away from the map center
    time_limit: 160          # his 1200-step cap at 3 frames per step

ppo:
  learning_rate: 0.01
  n_steps: 256               # x 4 games ~ his memorySize 1000
  batch_size: 32
  n_epochs: 16
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [128, 128]
