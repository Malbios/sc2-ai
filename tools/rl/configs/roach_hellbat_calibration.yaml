# Survey calibration: roaches against the built-in AI's hellbats. The attack rule, to find sizes
# where attack-move wins 15 to 70% (then roach_hellbat.yaml). Marines are listed first in mixed
# fights and the order stays fixed: it sets the spawn formation. Run per build:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_hellbat_calibration.yaml --baseline attack --episodes 20 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_group_task:RoachGroupTask

enemy:
  mode: builtin
  race: Terran
  difficulty: VeryHard

scenarios:
  - name: roach_hellbat_8v6hb
    learner: {Roach: 8}
    enemy: {HellionTank: 6}
    distance: [10, 12]
    time_limit: 60

  - name: roach_hellbat_8v8hb
    learner: {Roach: 8}
    enemy: {HellionTank: 8}
    distance: [10, 12]
    time_limit: 60

  - name: roach_hellbat_8v10hb
    learner: {Roach: 8}
    enemy: {HellionTank: 10}
    distance: [10, 12]
    time_limit: 60

  - name: roach_hellbat_8v12hb
    learner: {Roach: 8}
    enemy: {HellionTank: 12}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
