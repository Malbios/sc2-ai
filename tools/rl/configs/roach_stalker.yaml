# The Zerg survey fight picked by calibration (roach_stalker_calibration.yaml, the attack rule, 20
# fights per built-in AI build): attack-move wins 30% with 8 roaches against 7 stalkers and 57%
# with 12 against 10 (8 vs 6: 100%, 8 vs 8: none). Every rule, per build:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_stalker.yaml --baseline attack --episodes 100 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_group_task:RoachGroupTask

enemy:
  mode: builtin
  race: Protoss
  difficulty: VeryHard

scenarios:
  - name: roach_stalker_8v7s
    learner: {Roach: 8}
    enemy: {Stalker: 7}
    distance: [10, 12]
    time_limit: 60

  - name: roach_stalker_12v10s
    learner: {Roach: 12}
    enemy: {Stalker: 10}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
