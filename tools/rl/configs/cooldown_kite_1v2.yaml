# The sharknice kiting task (see cooldown_kite_1v1.yaml) against 2 roaches.
#
#   python -m tools.rl.train --config tools/rl/configs/cooldown_kite_1v2.yaml --timesteps 400000 --out models/cooldown-scripted-1v2

map: MicroTraining410
decision_interval: 3

learner:
  race: Terran
  task: tools.rl.examples.cooldown_kite_task:CooldownKiteTask

enemy:
  mode: scripted             # the built-in AI's roaches flee (see cooldown_kite_1v1.yaml)
  race: Terran

scenarios:
  - name: stalker_vs_2_roaches
    learner: {Stalker: 1}
    enemy: {Roach: 2}
    distance: [10, 10]
    time_limit: 160

ppo:
  learning_rate: 0.01
  n_steps: 256
  batch_size: 32
  n_epochs: 16
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [128, 128]
