# The Zerg survey fight picked by calibration (mutalisk_hydralisk_calibration.yaml, the attack
# rule, 20 fights per built-in AI build): attack-move wins 10% with 12 mutalisks against 11
# hydralisks, just under 15% but the closest size (10 vs 8: 100%, 10 vs 9: 5%, 10 vs 10 and 12 vs
# 12: none). Every rule, per build:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/mutalisk_hydralisk.yaml --baseline attack --episodes 100 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.mutalisk_group_task:MutaliskGroupTask

enemy:
  mode: builtin
  race: Zerg
  difficulty: VeryHard

scenarios:
  - name: mutalisk_hydralisk_12v11h
    learner: {Mutalisk: 12}
    enemy: {Hydralisk: 11}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
