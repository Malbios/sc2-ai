# The roach and ravager fight picked by calibration (roach_ravager_group_calibration.yaml, the
# attack rule at 50 fights): 6 roaches and 2 ravagers win 18% against 12 marines and 3 marauders
# (98 to 100% against 8 to 10 marines and 3 marauders, none against 10 or more marines and 4
# marauders). Measured against bio that stands in bile and bio that steps out of it. For the
# headroom survey, every rule at 200 fights:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_ravager_group.yaml --baseline bile --episodes 200

map: MicroTraining410
decision_interval: 3         # bile's lead assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_ravager_group_task:RoachRavagerGroupTask

enemy:
  mode: scripted
  race: Terran

scenarios:
  - name: rr_8v15
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 12, Marauder: 3}
    distance: [10, 12]
    time_limit: 60

  - name: rr_8v15_dodge
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 12, Marauder: 3}
    bile_dodge_reaction: [0.3, 0.6]
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
