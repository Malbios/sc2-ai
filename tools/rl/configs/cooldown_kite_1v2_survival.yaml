# Like cooldown_kite_1v2_finetune.yaml, but with a win reward of 100 x life left, so the model
# is paid for taking fewer hits: firing adds ~+200 per fight, which drowns out the plain task's
# win reward of at most +1.5.
#
#   python -m tools.rl.train --config tools/rl/configs/cooldown_kite_1v2_survival.yaml \
#       --resume models/cooldown-scripted-1v1/final.zip --timesteps 200000 --out models/cooldown-scripted-survival

map: MicroTraining
decision_interval: 3

learner:
  race: Terran
  task: tools.rl.examples.cooldown_kite_task:SurvivalCooldownKiteTask

enemy:
  mode: scripted             # the built-in AI's roaches flee (see cooldown_kite_1v1.yaml)
  race: Terran

scenarios:
  - name: stalker_vs_2_roaches
    learner: {Stalker: 1}
    enemy: {Roach: 2}
    distance: [10, 10]
    time_limit: 160
    weight: 3

  - name: stalker_vs_1_roach   # kept in the mix so the model doesn't forget the easy fight
    learner: {Stalker: 1}
    enemy: {Roach: 1}
    distance: [10, 10]
    time_limit: 160
    weight: 1

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [128, 128]         # must match the model being refined
