# cooldown_kite_1v1.yaml with SurvivalCooldownKiteTask: a win pays 100 x life left, so kiting (the
# kite rule wins with ~66% life left) pays clearly more than trading shots (~25% left). With the
# plain task, attacking non-stop fires as often as kiting and the model learned attack-only.
#
#   python -m tools.rl.train --config tools/rl/configs/cooldown_kite_1v1_survival.yaml --timesteps 100000 --out models/cooldown-scripted-1v1-survival

map: MicroTraining410        # his map, ported to SC2 4.10 (see docs/linux-setup.md)
decision_interval: 3         # his stepCount

learner:
  race: Terran
  task: tools.rl.examples.cooldown_kite_task:SurvivalCooldownKiteTask

enemy:
  # Not the built-in AI, as in his setup: it pulls its spawned units back when a fight looks bad,
  # so the stalker learned to chase fleeing roaches instead of kiting. Scripted roaches always
  # attack the closest unit, so they chase.
  mode: scripted
  race: Terran

scenarios:
  - name: stalker_vs_1_roach
    learner: {Stalker: 1}
    enemy: {Roach: 1}
    distance: [10, 10]       # he spawns both 5 away from the map center
    time_limit: 160          # his 1200-step cap at 3 frames per step

ppo:
  learning_rate: 0.01
  n_steps: 256               # x 4 games ~ his memorySize 1000
  batch_size: 32
  n_epochs: 16
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [128, 128]
