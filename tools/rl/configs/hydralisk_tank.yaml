# The survey fight picked by calibration (hydralisk_tank_calibration.yaml, the attack rule, 20
# fights per built-in AI build): attack-move wins 76% with 8 hydralisks against 8 marines + 3
# siege tanks and 8% against 10 + 3, just outside 15 to 70% on either side with nothing in between
# (+ 4 tanks: none). Every rule, per build:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/hydralisk_tank.yaml --baseline attack --episodes 100 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.hydralisk_group_task:HydraliskGroupTask
  upgrades: [EvolveMuscularAugments, EvolveGroovedSpines]

enemy:
  mode: builtin
  race: Terran
  difficulty: VeryHard

scenarios:
  - name: hydralisk_tank_8v8m3t
    learner: {Hydralisk: 8}
    enemy: {Marine: 8, SiegeTank: 3}
    distance: [10, 12]
    time_limit: 60

  - name: hydralisk_tank_8v10m3t
    learner: {Hydralisk: 8}
    enemy: {Marine: 10, SiegeTank: 3}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
