# tracking_kite_warm.yaml with gamma 0.999 instead of 0.99, starting from that run's model (98% vs 2
# chasing roaches). At 0.99 a reward 13 seconds away counted only a third, so a fast win with
# damage taken paid more than a slow safe one against leashing roaches. At 0.999 the safe win pays
# more.
#
#   python -m tools.rl.train --config tools/rl/configs/tracking_kite_warm_gamma.yaml --timesteps 1000000 --out models/tracking-kite-gamma --warm-start models/tracking-kite-warm/final.zip

map: MicroTraining410
decision_interval: 3         # TrackingKiteTask's movement scale assumes 3

learner:
  race: Terran
  task: tools.rl.examples.free_kite_task:TrackingKiteTask

enemy:
  mode: scripted             # each scenario's enemy_behavior says whether it chases or leashes
  race: Terran

scenarios:
  - name: stalker_vs_2_chasing_roaches
    learner: {Stalker: 1}
    enemy: {Roach: 2}
    distance: [10, 10]
    time_limit: 160
    weight: 3

  - name: stalker_vs_2_leashed_roaches
    learner: {Stalker: 1}
    enemy: {Roach: 2}
    enemy_behavior: leash
    leash: [8, 14]
    distance: [10, 10]
    time_limit: 160
    weight: 3

  - name: stalker_vs_1_chasing_roach
    learner: {Stalker: 1}
    enemy: {Roach: 1}
    distance: [10, 10]
    time_limit: 160
    weight: 1

  - name: stalker_vs_1_leashed_roach
    learner: {Stalker: 1}
    enemy: {Roach: 1}
    enemy_behavior: leash
    leash: [8, 14]
    distance: [10, 10]
    time_limit: 160
    weight: 1

ppo:
  learning_rate: 0.0001
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
