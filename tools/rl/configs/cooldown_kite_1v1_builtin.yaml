# cooldown_kite_1v1.yaml with the built-in AI as the enemy, as in sharknice's setup. On this map
# both start locations are at the center, so the AI's roach defends the center: it chases the
# stalker, gives up at the edge of its leash and walks back, which is what his video shows.
#
#   python -m tools.rl.train --config tools/rl/configs/cooldown_kite_1v1_builtin.yaml --timesteps 100000 --out models/cooldown-builtin-1v1

map: MicroTraining410        # his map, ported to SC2 4.10 (see docs/linux-setup.md)
decision_interval: 3         # his stepCount

learner:
  race: Terran
  task: tools.rl.examples.cooldown_kite_task:CooldownKiteTask

enemy:
  mode: builtin
  race: Terran
  difficulty: VeryHard

scenarios:
  - name: stalker_vs_1_roach
    learner: {Stalker: 1}
    enemy: {Roach: 1}
    distance: [10, 10]       # he spawns both 5 away from the map center
    time_limit: 160          # his 1200-step cap at 3 frames per step

ppo:
  learning_rate: 0.01
  n_steps: 256               # x 4 games ~ his memorySize 1000
  batch_size: 32
  n_epochs: 16
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [128, 128]
