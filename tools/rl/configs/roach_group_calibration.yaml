# Roaches against more marines and marauders than they cost, no upgrades on either side, at
# three sizes. At equal cost attack-move won every fight (the bio has no stim), and a kiting
# enemy made no difference (it only steps back from targets within 3; roaches shoot from 4).
# For measuring the attack rule first, to pick sizes where attack-move neither always wins nor
# always loses; then the rules on those sizes show whether micro matters in this fight:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_group_calibration.yaml --baseline attack --episodes 50

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_group_task:RoachGroupTask

enemy:
  mode: scripted
  race: Terran

scenarios:
  - name: roaches_8v13
    learner: {Roach: 8}
    enemy: {Marine: 9, Marauder: 4}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_8v14
    learner: {Roach: 8}
    enemy: {Marine: 10, Marauder: 4}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_10v16
    learner: {Roach: 10}
    enemy: {Marine: 12, Marauder: 4}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_10v17
    learner: {Roach: 10}
    enemy: {Marine: 12, Marauder: 5}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_12v19
    learner: {Roach: 12}
    enemy: {Marine: 14, Marauder: 5}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_12v21
    learner: {Roach: 12}
    enemy: {Marine: 15, Marauder: 6}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
