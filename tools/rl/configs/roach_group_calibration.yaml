# Roaches against marines and marauders of the same cost, no upgrades on either side, against
# an enemy that stands and shoots (chase) or steps back while reloading (kite), at three sizes.
# For measuring the attack rule first, to pick sizes where attack-move neither always wins nor
# always loses; then the rules on those sizes show whether micro matters in this fight:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_group_calibration.yaml --baseline attack --episodes 50

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_group_task:RoachGroupTask

enemy:
  mode: scripted
  race: Terran

scenarios:
  - name: roaches_6v8_chase
    learner: {Roach: 6}
    enemy: {Marine: 6, Marauder: 2}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_6v8_kite
    learner: {Roach: 6}
    enemy: {Marine: 6, Marauder: 2}
    enemy_behavior: kite
    distance: [10, 12]
    time_limit: 60

  - name: roaches_8v11_chase
    learner: {Roach: 8}
    enemy: {Marine: 8, Marauder: 3}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_8v11_kite
    learner: {Roach: 8}
    enemy: {Marine: 8, Marauder: 3}
    enemy_behavior: kite
    distance: [10, 12]
    time_limit: 60

  - name: roaches_10v14_chase
    learner: {Roach: 10}
    enemy: {Marine: 10, Marauder: 4}
    distance: [10, 12]
    time_limit: 60

  - name: roaches_10v14_kite
    learner: {Roach: 10}
    enemy: {Marine: 10, Marauder: 4}
    enemy_behavior: kite
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
