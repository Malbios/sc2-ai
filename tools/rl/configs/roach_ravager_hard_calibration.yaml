# A harder roach and ravager fight: the tuned bile rule (bile the most dangerous in range where it
# is now) won 96 / 87% (standing in bile / dodging) against 12 marines and 3 marauders, which
# leaves no room above it. More bio, for picking the size where it wins about half. A 4th marauder
# swings it too far (12 marines: 50 / 10%, 13: 14 / 0%, 12 marines and 5 marauders or more: 0 to
# 2%), so these add marines instead:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_ravager_hard_calibration.yaml --baseline bile_dangerous_lead_0 --episodes 50

map: MicroTraining410
decision_interval: 3         # bile's lead assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_ravager_group_task:RoachRavagerGroupTask
  decide_every: 1            # bile's lead assumes one decision per 3 game frames

enemy:
  mode: scripted
  race: Terran

scenarios:
  - name: rr_hard_13m3M
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 13, Marauder: 3}
    distance: [10, 12]
    time_limit: 60

  - name: rr_hard_13m3M_dodge
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 13, Marauder: 3}
    bile_dodge_reaction: [0.3, 0.6]
    distance: [10, 12]
    time_limit: 60

  - name: rr_hard_14m3M
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 14, Marauder: 3}
    distance: [10, 12]
    time_limit: 60

  - name: rr_hard_14m3M_dodge
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 14, Marauder: 3}
    bile_dodge_reaction: [0.3, 0.6]
    distance: [10, 12]
    time_limit: 60

  - name: rr_hard_15m3M
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 15, Marauder: 3}
    distance: [10, 12]
    time_limit: 60

  - name: rr_hard_15m3M_dodge
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 15, Marauder: 3}
    bile_dodge_reaction: [0.3, 0.6]
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0001
  learning_rate_end: 0.00001
  n_steps: 256
  batch_size: 256
  n_epochs: 4
  gamma: 0.999
  ent_coef: 0.0
  clip_range: 0.1
  target_kl: 0.02
  net_arch: [128, 128]
