# ravager_mixed.yaml plus winnable 1 vs 1 fights. Trained on 1 vs 2 only, the model almost never
# won and plateaued below every rule. Every rule wins 1 vs 1, but the life left differs a lot
# (plain attack loses 86%, a led bile 22 to 44% against chasers and dodgers, kiting without bile
# 10% against leashers), so these fights pay for good kiting and aimed bile from the start.
#
#   python -m tools.rl.train --config tools/rl/configs/ravager_curriculum.yaml --timesteps 2000000 --out models/ravager-curriculum

map: MicroTraining410
decision_interval: 3         # RavagerTask's movement scale and bile lead assume 3

learner:
  race: Zerg
  task: tools.rl.examples.ravager_task:RavagerTask

enemy:
  mode: scripted
  race: Zerg

scenarios:
  - name: ravager_1v1_chase
    learner: {Ravager: 1}
    enemy: {Roach: 1}
    distance: [10, 10]
    time_limit: 160
    weight: 1

  - name: ravager_1v1_dodge
    learner: {Ravager: 1}
    enemy: {Roach: 1}
    bile_dodge_reaction: [0.3, 0.9]
    distance: [10, 10]
    time_limit: 160
    weight: 1

  - name: ravager_1v1_leash
    learner: {Ravager: 1}
    enemy: {Roach: 1}
    enemy_behavior: leash
    leash: [8, 14]
    distance: [10, 10]
    time_limit: 160
    weight: 1

  - name: ravager_1v2_chase
    learner: {Ravager: 1}
    enemy: {Roach: 2}
    distance: [10, 10]
    time_limit: 160
    weight: 2

  - name: ravager_1v2_dodge
    learner: {Ravager: 1}
    enemy: {Roach: 2}
    bile_dodge_reaction: [0.3, 0.9]
    distance: [10, 10]
    time_limit: 160
    weight: 2

  - name: ravager_1v2_leash
    learner: {Ravager: 1}
    enemy: {Roach: 2}
    enemy_behavior: leash
    leash: [8, 14]
    distance: [10, 10]
    time_limit: 160
    weight: 1

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
