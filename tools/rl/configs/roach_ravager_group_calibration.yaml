# Roaches with ravagers against marines and marauders without upgrades that chase, standing in
# bile or stepping out of it (after 0.3 to 0.6 s), at three sizes costing the same as the Zerg
# side or up to 10% more. For measuring the attack rule first, to pick sizes
# where attack-move neither always wins nor always loses; then every rule on those sizes (the
# headroom survey):
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_ravager_group_calibration.yaml --baseline attack --episodes 50

map: MicroTraining410
decision_interval: 3         # bile's lead assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_ravager_group_task:RoachRavagerGroupTask

enemy:
  mode: scripted
  race: Terran

scenarios:
  - name: rr_6v12
    learner: {Roach: 4, Ravager: 2}
    enemy: {Marine: 9, Marauder: 3}
    distance: [10, 12]
    time_limit: 60

  - name: rr_6v12_dodge
    learner: {Roach: 4, Ravager: 2}
    enemy: {Marine: 9, Marauder: 3}
    bile_dodge_reaction: [0.3, 0.6]
    distance: [10, 12]
    time_limit: 60

  - name: rr_8v16
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 12, Marauder: 4}
    distance: [10, 12]
    time_limit: 60

  - name: rr_8v16_dodge
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 12, Marauder: 4}
    bile_dodge_reaction: [0.3, 0.6]
    distance: [10, 12]
    time_limit: 60

  - name: rr_10v19
    learner: {Roach: 7, Ravager: 3}
    enemy: {Marine: 14, Marauder: 5}
    distance: [10, 12]
    time_limit: 60

  - name: rr_10v19_dodge
    learner: {Roach: 7, Ravager: 3}
    enemy: {Marine: 14, Marauder: 5}
    bile_dodge_reaction: [0.3, 0.6]
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
