# Roaches with ravagers against marines and marauders without upgrades that chase, at three
# sizes. At about equal cost (4+2 vs 9+3, 6+2 vs 12+4, 7+3 vs 14+5) attack-move lost every fight:
# without bile, ravagers are poor value. 6+2 against 8 to 10 marines and 3 marauders won 98 to
# 100%, so these sizes are in between. Attack-move never biles, so whether the enemy dodges bile
# can't change its result; the measurement (roach_ravager_group.yaml) adds dodging. For measuring
# the attack rule first, to pick sizes where attack-move neither always wins nor always loses:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/roach_ravager_group_calibration.yaml --baseline attack --episodes 50

map: MicroTraining410
decision_interval: 3         # bile's lead assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.roach_ravager_group_task:RoachRavagerGroupTask

enemy:
  mode: scripted
  race: Terran

scenarios:
  - name: rr_8v14
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 10, Marauder: 4}
    distance: [10, 12]
    time_limit: 60

  - name: rr_8v15
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 11, Marauder: 4}
    distance: [10, 12]
    time_limit: 60

  - name: rr_8v15_fewer_marauders
    learner: {Roach: 6, Ravager: 2}
    enemy: {Marine: 12, Marauder: 3}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
