# Stability sweep: zergling_surround_attack_start.yaml with both the stability settings of
# zergling_sweep_stable.yaml and the reward scaling of zergling_sweep_scaled.yaml.
# Run twice (--seed 1 and 2); tools.rl.stability tells whether each run held its gains.
#
#   python -m tools.rl.train --config tools/rl/configs/zergling_sweep_both.yaml --timesteps 2500000 --seed 1 --out models/sweep-both-1

map: MicroTraining410
decision_interval: 3

learner:
  race: Zerg
  task: tools.rl.examples.zergling_surround_task:ZerglingSurroundTask
  upgrades: [ZerglingMovementSpeed]
  decide_every: 3

enemy:
  mode: scripted
  race: Terran

scenarios:
  - name: lings_8v5_chase
    learner: {Zergling: 8}
    enemy: {Marine: 5}
    distance: [10, 12]
    time_limit: 60

  - name: lings_8v5_kite
    learner: {Zergling: 8}
    enemy: {Marine: 5}
    enemy_behavior: kite
    distance: [10, 12]
    time_limit: 60

  - name: lings_8v6_chase
    learner: {Zergling: 8}
    enemy: {Marine: 6}
    distance: [10, 12]
    time_limit: 60

  - name: lings_8v6_kite
    learner: {Zergling: 8}
    enemy: {Marine: 6}
    enemy_behavior: kite
    distance: [10, 12]
    time_limit: 60

  - name: lings_12v8_chase
    learner: {Zergling: 12}
    enemy: {Marine: 8}
    distance: [10, 12]
    time_limit: 60

  - name: lings_12v8_kite
    learner: {Zergling: 12}
    enemy: {Marine: 8}
    enemy_behavior: kite
    distance: [10, 12]
    time_limit: 60

  - name: lings_12v9_chase
    learner: {Zergling: 12}
    enemy: {Marine: 9}
    distance: [10, 12]
    time_limit: 60

  - name: lings_12v9_kite
    learner: {Zergling: 12}
    enemy: {Marine: 9}
    enemy_behavior: kite
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0001
  learning_rate_end: 0.00001
  n_steps: 256
  batch_size: 256
  n_epochs: 4
  gamma: 0.999
  ent_coef: 0.0
  clip_range: 0.1
  target_kl: 0.02
  normalize_reward: true
  net_arch: [128, 128]
