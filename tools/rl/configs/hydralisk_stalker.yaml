# The Zerg survey fight picked by calibration (hydralisk_stalker_calibration.yaml, the attack
# rule, 20 fights per built-in AI build): attack-move wins 45% with 8 hydralisks against 9
# stalkers and 22% with 10 against 12 (8 vs 8: 100%, 8 vs 10: none). Every rule, per build:
#
#   python -m tools.rl.evaluate --config tools/rl/configs/hydralisk_stalker.yaml --baseline attack --episodes 100 --enemy-build Rush

map: MicroTraining410
decision_interval: 3         # the task's movement scale assumes 3

learner:
  race: Zerg
  task: tools.rl.examples.hydralisk_group_task:HydraliskGroupTask
  upgrades: [EvolveMuscularAugments, EvolveGroovedSpines]

enemy:
  mode: builtin
  race: Protoss
  difficulty: VeryHard

scenarios:
  - name: hydralisk_stalker_8v9s
    learner: {Hydralisk: 8}
    enemy: {Stalker: 9}
    distance: [10, 12]
    time_limit: 60

  - name: hydralisk_stalker_10v12s
    learner: {Hydralisk: 10}
    enemy: {Stalker: 12}
    distance: [10, 12]
    time_limit: 60

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  ent_coef: 0.01
  net_arch: [128, 128]
